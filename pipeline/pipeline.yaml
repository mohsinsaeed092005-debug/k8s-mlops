# PIPELINE DEFINITION
# Name: iris-pipeline
# Description: Load Data -> Train -> Evaluate -> Register Model
# Inputs:
#    model_name: str [Default: 'iris-model']
#    n_estimators: int [Default: 100.0]
#    tracking_uri: str [Default: 'http://mlflow.mlops.svc.cluster.local:5000']
# Outputs:
#    evaluate-metrics: system.Metrics
components:
  comp-evaluate:
    executorLabel: exec-evaluate
    inputDefinitions:
      artifacts:
        model_in:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
  comp-load-data:
    executorLabel: exec-load-data
    outputDefinitions:
      artifacts:
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-register-model:
    executorLabel: exec-register-model
    inputDefinitions:
      artifacts:
        model_in:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        accuracy:
          parameterType: NUMBER_DOUBLE
        model_name:
          parameterType: STRING
        tracking_uri:
          parameterType: STRING
  comp-train:
    executorLabel: exec-train
    inputDefinitions:
      artifacts:
        train_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        n_estimators:
          defaultValue: 100.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        model_out:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \ 'pandas==2.2.3' 'joblib' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate(\n    model_in: Input[Model],\n    test_data: Input[Dataset],\n\
          \    metrics: Output[Metrics]\n) -> float:\n    import joblib\n    import\
          \ pandas as pd\n    from sklearn.metrics import accuracy_score\n\n    model\
          \ = joblib.load(model_in.path)\n    df = pd.read_csv(test_data.path)\n\n\
          \    acc = float(\n        accuracy_score(\n            df[\"target\"],\n\
          \            model.predict(df.drop(columns=\"target\"))\n        )\n   \
          \ )\n\n    metrics.log_metric(\"accuracy\", acc)\n    return acc\n\n"
        image: python:3.11
    exec-load-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - load_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \ 'pandas==2.2.3' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_data(train_data: Output[Dataset], test_data: Output[Dataset]):\n\
          \    from sklearn.datasets import load_iris\n    from sklearn.model_selection\
          \ import train_test_split\n\n    df = load_iris(as_frame=True).frame.dropna().drop_duplicates()\n\
          \n    train, test = train_test_split(\n        df,\n        test_size=0.2,\n\
          \        random_state=42,\n        stratify=df[\"target\"]\n    )\n\n  \
          \  train.to_csv(train_data.path, index=False)\n    test.to_csv(test_data.path,\
          \ index=False)\n\n"
        image: python:3.11
    exec-register-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'mlflow==3.18.0'\
          \ 'scikit-learn==1.5.2' 'pandas==2.2.3' 'joblib' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model(\n    model_in: Input[Model],\n    accuracy: float,\n\
          \    tracking_uri: str,\n    model_name: str\n):\n    import joblib\n  \
          \  import mlflow\n    import mlflow.sklearn\n    from mlflow.tracking import\
          \ MlflowClient\n\n    mlflow.set_tracking_uri(tracking_uri)\n    mlflow.set_experiment(\"\
          iris\")\n\n    model = joblib.load(model_in.path)\n\n    with mlflow.start_run():\n\
          \        mlflow.log_metric(\"accuracy\", accuracy)\n\n        mlflow.sklearn.log_model(\n\
          \            model,\n            name=\"model\",\n            registered_model_name=model_name,\n\
          \            skops_trusted_types=[\"sklearn.tree._tree.Tree\"]\n       \
          \ )\n\n    client = MlflowClient()\n\n    versions = client.search_model_versions(\n\
          \        f\"name='{model_name}'\"\n    )\n\n    v = str(max(int(x.version)\
          \ for x in versions))\n\n    try:\n        client.transition_model_version_stage(\n\
          \            model_name, v, \"Staging\"\n        )\n        client.transition_model_version_stage(\n\
          \            model_name, v, \"Production\"\n        )\n\n        print(f\"\
          Version {v} moved to Production (stage)\")\n\n    except Exception as e:\n\
          \        print(\"Stage transition unavailable; assigning registry aliases:\"\
          , e)\n\n    # MLflow stages are legacy; serving consumes the stable production\
          \ alias.\n    client.set_registered_model_alias(model_name, \"staging\"\
          , v)\n    client.set_registered_model_alias(model_name, \"production\",\
          \ v)\n    print(f\"Aliases staging and production now point to version {v}\"\
          )\n\n"
        image: python:3.11
    exec-train:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'scikit-learn==1.5.2'\
          \ 'pandas==2.2.3' 'joblib' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train(\n    train_data: Input[Dataset],\n    model_out: Output[Model],\n\
          \    n_estimators: int = 100\n):\n    import joblib\n    import pandas as\
          \ pd\n    from sklearn.ensemble import RandomForestClassifier\n\n    df\
          \ = pd.read_csv(train_data.path)\n    X, y = df.drop(columns=\"target\"\
          ), df[\"target\"]\n\n    clf = RandomForestClassifier(\n        n_estimators=n_estimators,\n\
          \        random_state=42\n    ).fit(X, y)\n\n    joblib.dump(clf, model_out.path)\n\
          \n"
        image: python:3.11
pipelineInfo:
  description: Load Data -> Train -> Evaluate -> Register Model
  name: iris-pipeline
root:
  dag:
    outputs:
      artifacts:
        evaluate-metrics:
          artifactSelectors:
          - outputArtifactKey: metrics
            producerSubtask: evaluate
    tasks:
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - load-data
        - train
        inputs:
          artifacts:
            model_in:
              taskOutputArtifact:
                outputArtifactKey: model_out
                producerTask: train
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: load-data
        taskInfo:
          name: evaluate
      load-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-data
        taskInfo:
          name: load-data
      register-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-register-model
        dependentTasks:
        - evaluate
        - train
        inputs:
          artifacts:
            model_in:
              taskOutputArtifact:
                outputArtifactKey: model_out
                producerTask: train
          parameters:
            accuracy:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: evaluate
            model_name:
              componentInputParameter: model_name
            tracking_uri:
              componentInputParameter: tracking_uri
        taskInfo:
          name: register-model
      train:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train
        dependentTasks:
        - load-data
        inputs:
          artifacts:
            train_data:
              taskOutputArtifact:
                outputArtifactKey: train_data
                producerTask: load-data
          parameters:
            n_estimators:
              componentInputParameter: n_estimators
        taskInfo:
          name: train
  inputDefinitions:
    parameters:
      model_name:
        defaultValue: iris-model
        isOptional: true
        parameterType: STRING
      n_estimators:
        defaultValue: 100.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      tracking_uri:
        defaultValue: http://mlflow.mlops.svc.cluster.local:5000
        isOptional: true
        parameterType: STRING
  outputDefinitions:
    artifacts:
      evaluate-metrics:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.7.0
