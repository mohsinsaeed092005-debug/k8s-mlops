# PIPELINE DEFINITION
# Name: iris-pipeline
# Description: Engineer 10 Iris features -> Train -> Evaluate -> Register
# Inputs:
#    data_csv_b64: str [Default: '']
#    model_name: str [Default: 'iris-model']
#    n_estimators: int [Default: 100.0]
#    tracking_uri: str [Default: 'http://mlflow.mlops.svc.cluster.local:5000']
# Outputs:
#    evaluate-metrics: system.Metrics
components:
  comp-evaluate:
    executorLabel: exec-evaluate
    inputDefinitions:
      artifacts:
        model_in:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
  comp-load-data:
    executorLabel: exec-load-data
    inputDefinitions:
      parameters:
        data_csv_b64:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-register-model:
    executorLabel: exec-register-model
    inputDefinitions:
      artifacts:
        model_in:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        accuracy:
          parameterType: NUMBER_DOUBLE
        model_name:
          parameterType: STRING
        tracking_uri:
          parameterType: STRING
  comp-train:
    executorLabel: exec-train
    inputDefinitions:
      artifacts:
        train_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        n_estimators:
          defaultValue: 100.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        model_out:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate(model_in: Input[Model], test_data: Input[Dataset], metrics:\
          \ Output[Metrics]) -> float:\n    import joblib\n    import pandas as pd\n\
          \    from sklearn.metrics import (\n        accuracy_score, classification_report,\
          \ confusion_matrix,\n        f1_score, precision_score, recall_score,\n\
          \    )\n\n    model = joblib.load(model_in.path)\n    df = pd.read_csv(test_data.path)\n\
          \    X, y = df.drop(columns=\"target\"), df[\"target\"]\n    predicted =\
          \ model.predict(X)\n    accuracy = float(accuracy_score(y, predicted))\n\
          \    metrics.log_metric(\"accuracy\", accuracy)\n    metrics.log_metric(\"\
          precision_macro\", float(precision_score(y, predicted, average=\"macro\"\
          , zero_division=0)))\n    metrics.log_metric(\"recall_macro\", float(recall_score(y,\
          \ predicted, average=\"macro\", zero_division=0)))\n    metrics.log_metric(\"\
          f1_macro\", float(f1_score(y, predicted, average=\"macro\", zero_division=0)))\n\
          \    print(\"Confusion matrix (classes 0, 1, 2):\\n\", confusion_matrix(y,\
          \ predicted, labels=[0, 1, 2]))\n    print(\"Classification report:\\n\"\
          , classification_report(y, predicted, labels=[0, 1, 2], target_names=[\"\
          setosa\", \"versicolor\", \"virginica\"], zero_division=0))\n    return\
          \ accuracy\n\n"
        image: iris-pipeline:v1
    exec-load-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - load_data
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_data(data_csv_b64: str, train_data: Output[Dataset], test_data:\
          \ Output[Dataset]):\n    \"\"\"Read the checked-in data, engineer features,\
          \ then make a stratified split.\"\"\"\n    import base64\n    import io\n\
          \n    import numpy as np\n    import pandas as pd\n    from sklearn.model_selection\
          \ import train_test_split\n\n    raw_columns = [\n        \"sepal length\
          \ (cm)\",\n        \"sepal width (cm)\",\n        \"petal length (cm)\"\
          ,\n        \"petal width (cm)\",\n    ]\n    csv_bytes = base64.b64decode(data_csv_b64)\n\
          \    df = pd.read_csv(io.BytesIO(csv_bytes))\n    for column in raw_columns\
          \ + [\"target\"]:\n        df[column] = pd.to_numeric(df[column], errors=\"\
          coerce\")\n    df = df.dropna(subset=[\"target\"]).copy()\n    df[\"sepal\
          \ area (cm^2)\"] = df[raw_columns[0]] * df[raw_columns[1]]\n    df[\"petal\
          \ area (cm^2)\"] = df[raw_columns[2]] * df[raw_columns[3]]\n    # Use zero\
          \ for ratios with a zero denominator; missing input remains missing\n  \
          \  # and is imputed from training data only in the model pipeline.\n   \
          \ df[\"sepal ratio\"] = np.divide(\n        df[raw_columns[0]].to_numpy(float),\
          \ df[raw_columns[1]].to_numpy(float),\n        out=np.zeros(len(df), dtype=float),\
          \ where=df[raw_columns[1]].to_numpy(float) != 0,\n    )\n    df[\"petal\
          \ ratio\"] = np.divide(\n        df[raw_columns[2]].to_numpy(float), df[raw_columns[3]].to_numpy(float),\n\
          \        out=np.zeros(len(df), dtype=float), where=df[raw_columns[3]].to_numpy(float)\
          \ != 0,\n    )\n    df[\"total length (cm)\"] = df[raw_columns[0]] + df[raw_columns[2]]\n\
          \    df[\"total width (cm)\"] = df[raw_columns[1]] + df[raw_columns[3]]\n\
          \    df[\"target\"] = df[\"target\"].astype(int)\n\n    train, test = train_test_split(\n\
          \        df, test_size=0.2, random_state=42, stratify=df[\"target\"]\n \
          \   )\n    train.to_csv(train_data.path, index=False)\n    test.to_csv(test_data.path,\
          \ index=False)\n\n"
        image: iris-pipeline:v1
    exec-register-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - register_model
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef register_model(model_in: Input[Model], accuracy: float, tracking_uri:\
          \ str, model_name: str):\n    import joblib\n    import mlflow\n    import\
          \ mlflow.sklearn\n    from mlflow.tracking import MlflowClient\n\n    mlflow.set_tracking_uri(tracking_uri)\n\
          \    mlflow.set_experiment(\"iris\")\n    model = joblib.load(model_in.path)\n\
          \    with mlflow.start_run():\n        mlflow.log_metric(\"test_accuracy\"\
          , accuracy)\n        mlflow.sklearn.log_model(\n            model, name=\"\
          model\", registered_model_name=model_name,\n            skops_trusted_types=[\"\
          sklearn.tree._tree.Tree\", \"numpy.dtype\"],\n        )\n\n    client =\
          \ MlflowClient()\n    versions = client.search_model_versions(f\"name='{model_name}'\"\
          )\n    version = str(max(int(item.version) for item in versions))\n    try:\n\
          \        client.transition_model_version_stage(model_name, version, \"Staging\"\
          )\n        client.transition_model_version_stage(model_name, version, \"\
          Production\")\n    except Exception as error:\n        print(\"Stage transition\
          \ unavailable; assigning aliases:\", error)\n    client.set_registered_model_alias(model_name,\
          \ \"staging\", version)\n    client.set_registered_model_alias(model_name,\
          \ \"production\", version)\n    print(f\"Aliases staging and production\
          \ now point to version {version}\")\n\n"
        image: iris-pipeline:v1
    exec-train:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train(train_data: Input[Dataset], model_out: Output[Model], n_estimators:\
          \ int = 100):\n    \"\"\"Select RF or Decision Tree by training-only cross\
          \ validation.\"\"\"\n    import joblib\n    import pandas as pd\n    from\
          \ sklearn.impute import SimpleImputer\n    from sklearn.model_selection\
          \ import StratifiedKFold, cross_val_score\n    from sklearn.pipeline import\
          \ make_pipeline\n    from sklearn.tree import DecisionTreeClassifier\n \
          \   from sklearn.ensemble import RandomForestClassifier\n\n    df = pd.read_csv(train_data.path)\n\
          \    X, y = df.drop(columns=\"target\"), df[\"target\"]\n    candidates\
          \ = {\n        \"random_forest\": RandomForestClassifier(n_estimators=n_estimators,\
          \ random_state=42),\n        \"decision_tree\": DecisionTreeClassifier(random_state=42),\n\
          \    }\n    cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\n\
          \    scores = {\n        name: cross_val_score(\n            make_pipeline(SimpleImputer(strategy=\"\
          median\"), estimator),\n            X, y, cv=cv, scoring=\"f1_macro\",\n\
          \        ).mean()\n        for name, estimator in candidates.items()\n \
          \   }\n    best_name = max(scores, key=scores.get)\n    best_model = make_pipeline(\n\
          \        SimpleImputer(strategy=\"median\"), candidates[best_name]\n   \
          \ ).fit(X, y)\n    joblib.dump(best_model, model_out.path)\n    model_out.metadata[\"\
          algorithm\"] = best_name\n    model_out.metadata[\"cv_f1_macro\"] = float(scores[best_name])\n\
          \    print(f\"Selected {best_name}; CV macro F1={scores[best_name]:.4f};\
          \ all features={list(X.columns)}\")\n\n"
        image: iris-pipeline:v1
pipelineInfo:
  description: Engineer 10 Iris features -> Train -> Evaluate -> Register
  name: iris-pipeline
root:
  dag:
    outputs:
      artifacts:
        evaluate-metrics:
          artifactSelectors:
          - outputArtifactKey: metrics
            producerSubtask: evaluate
    tasks:
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - load-data
        - train
        inputs:
          artifacts:
            model_in:
              taskOutputArtifact:
                outputArtifactKey: model_out
                producerTask: train
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: load-data
        taskInfo:
          name: evaluate
      load-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-data
        inputs:
          parameters:
            data_csv_b64:
              componentInputParameter: data_csv_b64
        taskInfo:
          name: load-data
      register-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-register-model
        dependentTasks:
        - evaluate
        - train
        inputs:
          artifacts:
            model_in:
              taskOutputArtifact:
                outputArtifactKey: model_out
                producerTask: train
          parameters:
            accuracy:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: evaluate
            model_name:
              componentInputParameter: model_name
            tracking_uri:
              componentInputParameter: tracking_uri
        taskInfo:
          name: register-model
      train:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train
        dependentTasks:
        - load-data
        inputs:
          artifacts:
            train_data:
              taskOutputArtifact:
                outputArtifactKey: train_data
                producerTask: load-data
          parameters:
            n_estimators:
              componentInputParameter: n_estimators
        taskInfo:
          name: train
  inputDefinitions:
    parameters:
      data_csv_b64:
        defaultValue: 
        isOptional: true
        parameterType: STRING
      model_name:
        defaultValue: iris-model
        isOptional: true
        parameterType: STRING
      n_estimators:
        defaultValue: 100.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      tracking_uri:
        defaultValue: http://mlflow.mlops.svc.cluster.local:5000
        isOptional: true
        parameterType: STRING
  outputDefinitions:
    artifacts:
      evaluate-metrics:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.7.0
