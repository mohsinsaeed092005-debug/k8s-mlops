apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-serving
  labels:
    app: iris-serving
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iris-serving
  template:
    metadata:
      labels:
        app: iris-serving
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: iris-serving
      containers:
        - name: iris-serving
          image: iris-serving:v3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlops.svc.cluster.local:5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: iris-serving
  labels:
    app: iris-serving
spec:
  selector:
    app: iris-serving
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iris-serving
spec:
  ingressClassName: nginx
  rules:
    - host: iris.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iris-serving
                port:
                  number: 80
