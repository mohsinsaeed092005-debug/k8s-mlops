$kind: http-request
method: POST
url: '{{baseUrl}}/invocations'
order: 2000
description: Edit the four collection variables for the raw measurements. The request pre-script calculates six engineered features and sends all 10 model inputs.
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "inputs": {{iris_inputs}}
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const value = (key, fallback) => {
        const raw = pm.collectionVariables.get(key);
        return raw === undefined || raw === '' ? fallback : Number(raw);
      };
      const [sl, sw, pl, pw] = [
        value('sepal_length', 5.1), value('sepal_width', 3.5),
        value('petal_length', 1.4), value('petal_width', 0.2)
      ];
      const ratio = (a, b) => b === 0 ? 0 : a / b;
      pm.variables.set('iris_inputs', JSON.stringify([[
        sl, sw, pl, pw, sl * sw, pl * pw,
        ratio(sl, sw), ratio(pl, pw), sl + pl, sw + pw
      ]]));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Prediction endpoint returns HTTP 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response contains class, species, and confidence', function () {
        const body = pm.response.json();
        pm.expect(body.predictions).to.have.lengthOf(1);
        pm.expect([0, 1, 2]).to.include(body.predictions[0]);
        pm.expect(body.species).to.have.lengthOf(1);
        pm.expect(body.confidence).to.have.lengthOf(1);
      });
